<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Pedido - Northwind</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <h1>Novo Pedido</h1>
        
        <form method="POST" action="{{ url_for('novo_pedido') }}">
            <h2>Dados Básicos</h2>
            
            <div class="form-group">
                <label for="customer_name">Nome do Cliente:</label>
                <input type="text" id="customer_name" name="customer_name" required>
            </div>
            
            <div class="form-group">
                <label for="employee_name">Nome do Vendedor:</label>
                <input type="text" id="employee_name" name="employee_name" required>
            </div>
            
            <h2>Dados do Pedido</h2>
            
            <div class="form-group">
                <label for="orderdate">Data do Pedido:</label>
                <input type="date" id="orderdate" name="orderdate" value="2023-11-20" required>
            </div>
            
            <div class="form-group">
                <label for="requireddate">Data Requerida:</label>
                <input type="date" id="requireddate" name="requireddate" value="2023-11-25" required>
            </div>
            
            <div class="form-group">
                <label for="shipname">Nome de Envio:</label>
                <input type="text" id="shipname" name="shipname" value="Endereço de Teste" required>
            </div>
            
            <h2>Itens do Pedido</h2>
            
            <div id="itens-container">
                <!-- Itens serão adicionados aqui via JavaScript -->
                <div class="item-pedido">
                    <div class="form-group">
                        <label>Produto ID:</label>
                        <input type="number" name="item_0_productid" required>
                    </div>
                    <div class="form-group">
                        <label>Preço Unitário:</label>
                        <input type="number" step="0.01" name="item_0_unitprice" required>
                    </div>
                    <div class="form-group">
                        <label>Quantidade:</label>
                        <input type="number" name="item_0_quantity" required>
                    </div>
                    <div class="form-group">
                        <label>Desconto:</label>
                        <input type="number" step="0.01" name="item_0_discount" value="0.0" required>
                    </div>
                </div>
            </div>
            
            <button type="button" id="adicionar-item">Adicionar Item</button>
            
            <div class="form-group checkbox">
                <input type="checkbox" id="modo_seguro" name="modo_seguro" checked>
                <label for="modo_seguro">Modo Seguro (SQL Injection Protection)</label>
            </div>
            
            <button type="submit">Enviar Pedido</button>
        </form>
    </div>

    <script>
        let itemCount = 1;
        
        document.getElementById('adicionar-item').addEventListener('click', function() {
            const container = document.getElementById('itens-container');
            const newItem = document.createElement('div');
            newItem.className = 'item-pedido';
            newItem.innerHTML = `
                <div class="form-group">
                    <label>Produto ID:</label>
                    <input type="number" name="item_${itemCount}_productid" required>
                </div>
                <div class="form-group">
                    <label>Preço Unitário:</label>
                    <input type="number" step="0.01" name="item_${itemCount}_unitprice" required>
                </div>
                <div class="form-group">
                    <label>Quantidade:</label>
                    <input type="number" name="item_${itemCount}_quantity" required>
                </div>
                <div class="form-group">
                    <label>Desconto:</label>
                    <input type="number" step="0.01" name="item_${itemCount}_discount" value="0.0" required>
                </div>
            `;
            container.appendChild(newItem);
            itemCount++;
        });
    </script>
</body>
</html>
